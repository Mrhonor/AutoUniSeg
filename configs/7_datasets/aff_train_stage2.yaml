_BASE_: Base_SemanticSegmentation_afformer.yaml
MODEL:
  BACKBONE:
    NAME: "AFFormerMdsEncoderDecoder"
  META_ARCHITECTURE: "AFFormer_ARCH"
  WEIGHTS: "output/7ds_afformer_gnn_model_20w.pth"
  PRETRAINING: False
  SEM_SEG_HEAD:
    NAME: "CLS"
    OUTPUT_FEAT_DIM: 256
    BN_TYPE: "torchsyncbn"
  GNN:
    GNN_MODEL_NAME: "Learnable_Topology_BGNN_llama"
    NFEAT: 4096
    NFEAT_OUT: 1024
    nfeat_adj: 256
    adj_feat_dim: 256
    dropout_rate: 0.5
    threshold_value: 0.95
    calc_bipartite: False
    output_max_adj: True
    output_softmax_adj: True
    dataset_embedding: False
    uot_ratio: 1.0
    mse_or_adv: "None"
    GNN_type: "GSAGE"
    with_datasets_aux: False
    init_stage_iters: -1
    isGumbelSoftmax: False
    GNN_ITERS: 40000
    SEG_ITERS: 40000
    FIRST_STAGE_GNN_ITERS: 25000
    INIT_ADJ_PATH: "output/init_adjacency_7ds_aff.pt"
    N_POINTS: 1024