_BASE_: Base_SemanticSegmentation_setr.yaml
MODEL:
  META_ARCHITECTURE: "Setr_ARCH"
  SEM_SEG_HEAD:
    NAME: "VisionTransformerUpMulHead"
    img_size: 512
    num_upsampe_layer: 1
    in_channels: 1024
    channels: 512
    in_index: 23
    embed_dim: 1024
    num_classes: 256
    num_conv: 2
    upsampling_method: 'bilinear'
    align_corners: False
    conv3x3_conv1x1: False
    aux_in_index: [9, 14, 19]
    # aux_in_index: [9,]
    OUTPUT_FEAT_DIM: 256
    WITH_DATASETS_AUX: False
    BN_TYPE: "torchsyncbn"
  HRNET:
    BN_TYPE: "torchsyncbn"  
  GNN:
    GNN_MODEL_NAME: "Learnable_Topology_BGNN_llama"
    NFEAT: 4096
    NFEAT_OUT: 2048
    nfeat_adj: 256
    adj_feat_dim: 128
    dropout_rate: 0.5
    threshold_value: 0.95
    calc_bipartite: False
    output_max_adj: True
    output_softmax_adj: True
    uot_ratio: 1.0
    mse_or_adv: "None"
    GNN_type: "GSAGE"
    with_datasets_aux: False
    init_stage_iters: -1
    isGumbelSoftmax: False
    GNN_ITERS: 25
    SEG_ITERS: 25
    FIRST_STAGE_GNN_ITERS: 20
    INIT_ADJ_PATH: None
    N_POINTS: 1024
